[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "journal-direct-pdf-candidate"
version = "0.2.0rc1"
description = "Backend-independent candidate for reproducible journal figures; not a production runtime replacement."
requires-python = ">=3.11"
dependencies = ["PyMuPDF==1.26.7", "fonttools==4.63.0", "Pillow==12.3.0", "lxml==6.1.1", "python-pptx==1.0.2", "CairoSVG==2.8.2", "numpy==2.3.5", "opencv-python-headless==4.13.0.92"]

[project.scripts]
journal-pdf = "journal_pdf.cli:main"

[tool.setuptools.packages.find]
include = ["journal_pdf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
