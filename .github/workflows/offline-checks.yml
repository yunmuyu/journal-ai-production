name: Offline checks
on: [push, pull_request]
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test knowledge/production-policy.test.mjs knowledge/decision-corrections.test.mjs workbench/feedback-summary.test.mjs collaboration/current-delivery.test.mjs collaboration/tests/seal-release.test.mjs collaboration/tests/entrypoints.test.mjs collaboration/tests/snapshot-baseline.test.mjs collaboration/state-transfer/merge.test.mjs tests/font-policy.test.mjs tests/local-paths.test.mjs workbench/classification-store.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_release_bundle.py -v
      - run: node --test tests/private-migration.test.mjs tests/migration-review-state.test.mjs
      - run: python -m unittest discover -s portable-production/tests-local -p test_engine_directory.py -v
        env:
          PYTHONPATH: portable-production
      - run: python scripts/release_bundle.py build --candidate --root . --output "${{ runner.temp }}/journal-r49-draft.zip"
  production-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r portable-production/direct-pdf/requirements.txt pytest
      - name: Common raster, quality gate and source routing
        run: python -m pytest portable-production/tests-raster portable-production/tests-task portable-production/preflight/tests -q
        env:
          PYTHONPATH: portable-production:portable-production/preflight
      - name: Common vector figure rules (font-dependent cases require configured profile)
        run: python -m pytest portable-production/direct-pdf/tests/test_common_figure_rules.py portable-production/direct-pdf/tests/test_outside_legend_columns.py portable-production/direct-pdf/tests/test_chart_legend_fallback.py portable-production/direct-pdf/tests/test_source_legend.py portable-production/direct-pdf/tests/test_scene_compact_links.py -q -rs
        env:
          PYTHONPATH: portable-production/direct-pdf
      - name: Workbench dispatch and return gates
        run: node --test workbench/*.test.mjs
