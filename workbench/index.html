<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="期刊图件生产、终检反馈和能力研发工作台"><title>期刊AI生产工作台</title><link rel="stylesheet" href="/vendor/tabler.min.css"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
