<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图件分类 · 期刊AI生产工作台</title><link rel="stylesheet" href="/vendor/tabler.min.css"><link rel="stylesheet" href="/classification/classification.css"><script src="/classification/classification.js" defer></script></head><body class="classification-page">
<header class="page-header"><div><p class="eyebrow">现代信息科技 · 2026年10月</p><h1 class="page-title">图件分类</h1></div><nav class="nav nav-pills work-nav" aria-label="工作台页面"><a class="nav-link" href="/">当月生产</a><a class="nav-link active" href="/classification" aria-current="page">图件分类</a></nav><p id="intro" class="text-secondary">正在读取工作台分类…</p>
<div class="tools toolbar card card-body"><input class="form-control" id="search" aria-label="查找图件" placeholder="作者、图号、编号、图题"><select class="form-select" id="typeFilter" aria-label="筛选图件类型"><option value="">所有图件类型</option></select><select class="form-select" id="format" aria-label="筛选源格式"><option value="">所有源格式</option></select><select class="form-select" id="routeFilter" aria-label="筛选处理方式"><option value="">所有处理方式</option></select><select class="form-select" id="reviewFilter" aria-label="筛选审核状态"><option value="">所有审核状态</option></select><label>浏览<select class="form-select" id="group"><option value="type">按图件类型</option><option value="route">按处理方式（可拖动）</option><option value="gallery">连续图墙</option></select></label><button class="btn btn-primary" id="save" disabled>保存到工作台</button><button class="btn btn-outline-secondary" id="refresh">读取最新状态</button><button class="btn btn-outline-secondary" id="export">导出分类副本</button></div>
<div class="summary" id="summary"></div><div class="status" id="status" role="status"></div></header><main id="main"></main>
<footer>图件类型说明“这是什么图”；处理方式说明“准备怎么做”。用户已调整不等于全部检查通过，分类确认也不等于成品终检通过。源格式与文字提取证据点图可见；附件仅 JPG 不代表其他版本一定没有矢量。</footer>
<dialog id="modal"><div class="modalhead"><strong id="mtitle"></strong><button id="close">关闭</button></div><div class="modalbody" id="mbody"></div></dialog></body></html>
