<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图件分类 · 制作审核</title><link rel="stylesheet" href="/vendor/tabler.min.css"><link rel="stylesheet" href="/decision-review.css"><link rel="stylesheet" href="/decision-board.css"><script src="/figure-panzoom.js" defer></script><script src="/decision-review.js" type="module"></script><script src="/decision-board.js" type="module"></script></head><body><header><div><h1>图件分类 <span>制作方案审核</span></h1><small>只拖动不合适的方案，一次确认本批</small></div><span id="count"></span></header><div class="review-mode-bar" hidden><div class="btn-group" aria-label="审核模式"><button hidden id="mode-single" class="btn btn-outline-secondary" aria-pressed="false">单张审核</button><button id="mode-batch" class="btn btn-primary" aria-pressed="true">返回本批</button></div></div><p id="batch-note" class="board-hint" role="status"></p><details id="routing-summary" class="panel" hidden><summary id="routing-heading">本批分流结果</summary><p class="board-hint">按你的审校固定加工方式与栏宽；这里是分流条件，不代表已经制作。</p><div id="routing-list"></div><p id="routing-status" role="status"></p></details><section id="batch-review"><div class="board-toolbar"><div class="board-controls"><select hidden id="review-scope"><option value="pending">待制作方案</option></select><input hidden type="checkbox" id="prepared-only"><input class="form-control" id="board-search" placeholder="作者 / 图号" aria-label="筛选图件"><button class="btn btn-outline-secondary" id="undo-board">撤销上次移动</button><button class="btn btn-primary" id="confirm-board">确认当前批次</button></div></div><div class="board-controls"><button class="btn btn-outline-secondary" id="previous-batch">上一批</button><span id="batch-page" role="status"></span><button class="btn btn-outline-secondary" id="next-batch">下一批</button></div><p class="board-hint" id="board-hint"></p><details id="source-exceptions" hidden><summary id="source-count">图源异常</summary><div id="source-list"></div></details><div id="kanban" aria-label="本批完整制作方案"></div><details id="delivery-details" hidden><summary>拆分范围与备注</summary><div id="split-samples"></div></details><p id="board-status" role="status"></p></section><div class="review-layout" id="single-review" hidden><nav id="figures" aria-label="选择图件"></nav><main id="review"><p>正在读取…</p></main></div><dialog id="zoom"><button class="btn btn-sm" id="close-zoom">关闭</button><img alt="完整图件预览" id="zoom-image"></dialog><div id="notice" role="status"></div></body></html>
