<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图件分类 · 制作审核</title><link rel="stylesheet" href="/vendor/tabler.min.css"><link rel="stylesheet" href="/decision-review.css"><link rel="stylesheet" href="/decision-board.css"><script src="/figure-panzoom.js" defer></script><script src="/decision-review.js" type="module"></script><script src="/decision-board.js" type="module"></script></head><body><header><div><h1>图件分类 <span>制作方案审核</span></h1><small>制作前判断 · 单张与批量共用同一份记录</small></div><span id="count"></span></header><section id="batch-review"><div class="board-toolbar"><div class="btn-group" aria-label="审核项目"><button class="btn btn-primary" data-attribute="columns">栏宽</button><button class="btn btn-outline-secondary" data-attribute="method">加工方式</button><button class="btn btn-outline-secondary" data-attribute="split">拆分数量</button></div><div class="board-controls"><label><input type="checkbox" id="prepared-only" checked> 有完整预览</label><input class="form-control" id="board-search" placeholder="作者 / 图号" aria-label="筛选图件"><button class="btn btn-outline-secondary" id="undo-board">撤销上次移动</button><button class="btn btn-primary" id="confirm-board">确认当前批次</button></div></div><p class="board-hint" id="board-hint">拖动卡片标题调整；勾选多张可一起拖动。图片滚轮缩放，左键平移。</p><div id="kanban" aria-label="制作前判断拖拽看板"></div><p id="board-status" role="status"></p></section><button class="btn btn-outline-secondary" id="back-board" hidden>返回批量审核</button><div class="review-layout" id="single-review" hidden><nav id="figures" aria-label="选择图件"></nav><main id="review"><p>正在读取…</p></main></div><dialog id="zoom"><button class="btn btn-sm" id="close-zoom">关闭</button><img alt="完整图件预览" id="zoom-image"></dialog><div id="notice" role="status"></div></body></html>
