<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图件分类 · 制作审核</title><link rel="stylesheet" href="/vendor/tabler.min.css"><link rel="stylesheet" href="/decision-review.css"><link rel="stylesheet" href="/decision-board.css"><script src="/figure-panzoom.js" defer></script><script src="/decision-review.js" type="module"></script><script src="/decision-board.js" type="module"></script></head><body><header><div><h1>图件分类 <span>制作方案审核</span></h1><small>制作前判断 · 单张与批量共用同一份记录</small></div><span id="count"></span></header><div class="review-mode-bar"><div class="btn-group" aria-label="审核模式"><button id="mode-single" class="btn btn-outline-secondary" aria-pressed="false">单张审核</button><button id="mode-batch" class="btn btn-primary" aria-pressed="true">批量审核</button></div></div><p id="batch-note" class="board-hint" role="status"></p><details id="routing-summary" class="panel" hidden><summary id="routing-heading">本批分流结果</summary><p class="board-hint">按你的审校固定加工方式与栏宽；这里是分流条件，不代表已经制作。</p><div id="routing-list"></div><p id="routing-status" role="status"></p></details><section id="batch-review"><div class="board-toolbar"><div class="btn-group" aria-label="审核项目"><button class="btn btn-primary" data-attribute="kind">基础分类</button><button class="btn btn-outline-secondary" data-attribute="source">图源匹配</button><button class="btn btn-outline-secondary" data-attribute="split">拆分数量</button><button class="btn btn-outline-secondary" data-attribute="method">加工方式</button><button class="btn btn-primary" data-attribute="columns">栏宽</button></div><div class="board-controls"><select class="form-select" id="review-scope" aria-label="审核范围"><option value="pending">待制作方案</option><option value="all">全部未验收</option></select><label><input type="checkbox" id="prepared-only"> 有完整预览</label><input class="form-control" id="board-search" placeholder="作者 / 图号" aria-label="筛选图件"><button class="btn btn-outline-secondary" id="undo-board">撤销上次移动</button><button class="btn btn-primary" id="confirm-board">确认当前批次</button></div></div><div class="board-controls"><button class="btn btn-outline-secondary" id="previous-batch">上一批</button><span id="batch-page" role="status"></span><button class="btn btn-outline-secondary" id="next-batch">下一批</button></div><p class="board-hint" id="board-hint">拖动卡片标题调整；勾选多张可一起拖动。图片滚轮缩放，左键平移。</p><div id="source-list" hidden></div><div id="split-samples" hidden></div><div id="kanban" aria-label="制作前判断拖拽看板"></div><p id="board-status" role="status"></p></section><div class="review-layout" id="single-review" hidden><nav id="figures" aria-label="选择图件"></nav><main id="review"><p>正在读取…</p></main></div><dialog id="zoom"><button class="btn btn-sm" id="close-zoom">关闭</button><img alt="完整图件预览" id="zoom-image"></dialog><div id="notice" role="status"></div></body></html>
